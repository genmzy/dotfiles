# Kitty configuration
# vim:fileencoding=utf-8:foldmethod=marker

#: Font {{{
include fonts/geist.conf
disable_ligatures never
text_composition_strategy legacy
modify_font underline_thickness 50%
# }}}

#: Cursor {{{
cursor_trail 1
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 0
repaint_delay 10
# }}}

#: Appearance {{{
hide_window_decorations yes
tab_bar_style hidden
background_image ~/.config/wallpapers/catppuccin-girls.png
background_image_layout cscaled
background_image_linear no
background_tint 0.97
inactive_text_alpha -0.7
# }}}

#: Behaviors {{{
mouse_hide_wait -1
copy_on_select clipboard
paste_actions confirm,replace-dangerous-control-codes
shell_integration enabled
scrollback_lines 100000
# }}}

#: Keyboard shortcuts {{{
clear_all_shortcuts yes

# Clipboard
map alt+p paste_from_clipboard

map alt+t new_tab
# alt+- / alt+= do NOT wrap at the edges: kitty's previous_tab/next_tab are
# circular by design, so move-tab-clamped.py switches and stops at the first/last tab
map alt+minus previous_tab
map alt+equal next_tab
map alt+w close_window
map alt+o select_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
# last_tab (any >= tab count goes to last)
map alt+9 goto_tab 999
map alt+0 goto_tab 999

# Search
map alt+f search_scrollback
scrollback_pager env GOPATH="" nvim --cmd 'set eventignore=FileType' +'set nocursorline' +'nnoremap q ZQ' +'nnoremap <esc> ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# Window
map alt+f11 toggle_fullscreen

# hsplit/vsplit only apply inside the splits layout; pin it as startup layout
map_timeout 1.0
enabled_layouts splits,stack
map alt+ctrl+enter launch --location=hsplit
map alt+enter launch --location=vsplit
map ctrl+alt+h neighboring_window left
map ctrl+alt+l neighboring_window right
map ctrl+alt+k neighboring_window up
map ctrl+alt+j neighboring_window down
map ctrl+alt+minus move_tab_backward
map ctrl+alt+equal move_tab_forward

map alt+left_bracket change_font_size all -0.3
map alt+right_bracket change_font_size all +0.3
map alt+backslash change_font_size all 0

# Reload config
map alt+, load_config_file

map --new-mode vim --on-unknown ignore alt+space
map --mode vim space>e layout_action equalize
map --mode vim space>f toggle_layout stack
map --mode vim j scroll_line_down
map --mode vim k scroll_line_up
map --mode vim ctrl+d scroll_page_down
map --mode vim ctrl+u scroll_page_up
map --mode vim ctrl+f scroll_page_down
map --mode vim ctrl+b scroll_page_up
map --mode vim shift+j scroll_page_down
map --mode vim shift+k scroll_page_up
map --mode vim g>g scroll_home
map --mode vim shift+g scroll_end
map --mode vim / search_scrollback
map --mode vim y copy_to_clipboard
map --mode vim shift+semicolon command_palette
map --mode vim escape pop_keyboard_mode
map --mode vim alt+space pop_keyboard_mode
map --mode vim q pop_keyboard_mode
map --mode vim i pop_keyboard_mode
# }}}

#: Font {{{
env LANGUAGE=
env LANG=en_US.UTF-8
# }}}

#: Theme {{{
include mocha.conf
# }}}
